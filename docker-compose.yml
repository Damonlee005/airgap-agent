services:
  ollama:
    image: ollama/ollama:latest
    container_name: airgap-ollama
    networks:
      - isolated
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 5

  agent:
    build: .
    container_name: airgap-agent
    networks:
      - isolated
    env_file:
      - .env
    depends_on:
      ollama:
        condition: service_healthy
    stdin_open: true
    tty: true

networks:
  isolated:
    driver: bridge
    internal: true

volumes:
  ollama_data:
